apiVersion: nexus.io/edition/v1alpha1
kind: Edition
id: enterprise
description: Complete currently implemented shared-capability foundation
defaults:
  gateway: nginx
  website: wordpress
  authentication: keycloak
  service-status: kener
required:
  - gateway
  - authentication
allowed:
  - gateway
  - website
  - authentication
  - service-status
entitlements:
  - private-components
  - high-assurance-artifacts
