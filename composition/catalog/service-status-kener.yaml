apiVersion: nexus.io/component/v1alpha1
kind: ComponentImplementation
capability: service-status
implementation: kener
type: stack
fragment: composition/components/service-status/kener.compose.yml
dependencies:
  - gateway
services:
  - status
  - status-redis
artifacts:
  status:
    mode: verified-mirror
    repository: third-party/kener
    upstream: ghcr.io/rajnandan1/kener:v4.1.2
    digestVariable: KENER_IMAGE_DIGEST
  status-redis:
    mode: verified-mirror
    repository: third-party/redis
    upstream: redis:7.4-alpine
    digestVariable: REDIS_IMAGE_DIGEST
configuration:
  STATUS_DOMAIN:
    description: Public service-status hostname
    developmentDefault: status.localhost
    productionRequired: true
secrets:
  KENER_SECRET_KEY:
    description: Kener application signing and encryption secret
secretsEnvFiles:
  - system/system-status/.env
production:
  gatewayVolumes:
    - "./assets/gateway/templates-tls/25-status-tls.conf.template:/etc/nginx/templates/25-status-tls.conf.template:ro"
  environmentOverrides:
    - service: status
      key: ORIGIN
      value: "https://${STATUS_DOMAIN:?STATUS_DOMAIN is required}"
security:
  privateServices:
    - status-redis
  supportsNoNewPrivileges:
    - status
    - status-redis
