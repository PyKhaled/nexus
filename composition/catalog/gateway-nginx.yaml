apiVersion: nexus.io/component/v1alpha1
kind: ComponentImplementation
capability: gateway
implementation: nginx
type: service
fragment: composition/components/gateway/nginx.compose.yml
dependencies: []
services:
  - gateway
artifacts:
  gateway:
    mode: internal-build
    repository: system-gateway
    source: system/system-gateway
    digestVariable: GATEWAY_IMAGE_DIGEST
configuration:
  APP_DOMAIN:
    description: Public website hostname
    developmentDefault: localhost
    productionRequired: false
  AUTH_DOMAIN:
    description: Public authentication hostname
    developmentDefault: auth.localhost
    productionRequired: false
  STATUS_DOMAIN:
    description: Public service-status hostname
    developmentDefault: status.localhost
    productionRequired: false
  OVERSEER_DOMAIN:
    description: Public Overseer dashboard hostname
    developmentDefault: overseer.localhost
    productionRequired: false
  API_DOMAIN:
    description: Reserved public API hostname; system-service is a repository scaffold and is not yet a runnable upstream
    developmentDefault: api.localhost
    productionRequired: false
  API_UPSTREAM:
    description: Reserved API upstream address
    developmentDefault: "api:8000"
    productionRequired: false
  API_RATE_LIMIT:
    description: Reserved API gateway rate limit
    developmentDefault: 20r/s
    productionRequired: false
  API_RATE_BURST:
    description: Reserved API gateway rate limit burst
    developmentDefault: "40"
    productionRequired: false
  GATEWAY_HTTP_PORT:
    description: Published HTTP port
    developmentDefault: "80"
    productionRequired: false
  GATEWAY_HTTPS_PORT:
    description: Published HTTPS port
    developmentDefault: "443"
    productionRequired: false
  TLS_CERT_DIR:
    description: Absolute host path containing fullchain.pem and privkey.pem
    productionRequired: true
production:
  assetCopies:
    - source: system/system-gateway/templates-tls
      destination: assets/gateway/templates-tls
  environmentOverrides:
    - service: gateway
      key: GATEWAY_TLS_REDIRECT
      value: "1"
    - service: gateway
      key: TLS_CERTIFICATE
      value: /etc/nginx/ssl/fullchain.pem
    - service: gateway
      key: TLS_CERTIFICATE_KEY
      value: /etc/nginx/ssl/privkey.pem
  portMappings:
    - service: gateway
      mapping: "${GATEWAY_HTTPS_PORT:-443}:443"
  gatewayVolumes:
    - "${TLS_CERT_DIR:?TLS_CERT_DIR is required}:/etc/nginx/ssl:ro"
    - "./assets/gateway/templates-tls/01-default-tls.conf.template:/etc/nginx/templates/01-default-tls.conf.template:ro"
security:
  publicServices:
    - gateway
  supportsNoNewPrivileges:
    - gateway
