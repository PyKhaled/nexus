apiVersion: nexus.io/component/v1alpha1
kind: ComponentImplementation
capability: authentication
implementation: keycloak
type: stack
fragment: composition/components/authentication/keycloak.compose.yml
dependencies:
  - gateway
services:
  - keycloak
  - keycloak-db
artifacts:
  keycloak:
    mode: internal-build
    repository: system-auth
    source: system/system-auth
    digestVariable: KEYCLOAK_IMAGE_DIGEST
  keycloak-db:
    mode: verified-mirror
    repository: third-party/postgres
    upstream: postgres:16-alpine
    digestVariable: POSTGRES_IMAGE_DIGEST
configuration:
  AUTH_DOMAIN:
    description: Public authentication hostname
    developmentDefault: auth.localhost
    productionRequired: true
  KC_HOSTNAME:
    description: Keycloak public hostname
    developmentDefault: auth.localhost
    productionRequired: true
    scope: authentication-env
  AUTH_ENV_FILE:
    description: Absolute path to externally rendered runtime environment values
    productionRequired: true
secrets:
  KC_DB_PASSWORD:
    description: Keycloak database password
    scope: authentication-env
  KC_BOOTSTRAP_ADMIN_PASSWORD:
    description: Initial Keycloak administrator password
    scope: authentication-env
  POSTGRES_PASSWORD:
    description: Keycloak PostgreSQL password
    scope: authentication-env
secretsEnvFiles:
  - system/system-auth/.env
  - system/system-auth-db/.env
production:
  assetCopies:
    - source: system/system-auth/realm-config
      destination: assets/auth/realm-config
    - source: system/system-auth-db/config
      destination: assets/auth/postgres
  volumeRewrites:
    - service: keycloak
      matchPrefix: "./system/system-auth/realm-config:"
      replacement: "./assets/auth/realm-config:"
    - service: keycloak-db
      matchPrefix: "./system/system-auth-db/data:"
      namedVolume: keycloak-db-data
    - service: keycloak-db
      matchPrefix: "./system/system-auth-db/config/"
      replacement: "./assets/auth/postgres/"
  gatewayVolumes:
    - "./assets/gateway/templates-tls/21-auth-tls.conf.template:/etc/nginx/templates/21-auth-tls.conf.template:ro"
security:
  privateServices:
    - keycloak-db
  supportsNoNewPrivileges:
    - keycloak
    - keycloak-db
