services:
  overseer:
    image: ghcr.io/pykhaled/overseer:3.0
    restart: unless-stopped
    environment:
      OVERSEER_COMPOSE_PROJECT: ${OVERSEER_COMPOSE_PROJECT:-nexus-development}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - system
