---
services:
  gateway:
    build:
      context: "./system/system-gateway"
    image: nexus/system-gateway:local
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-app.localhost}"
      APP_UPSTREAM: "${APP_UPSTREAM:-website:80}"
      AUTH_DOMAIN: "${AUTH_DOMAIN:-auth.localhost}"
      AUTH_UPSTREAM: "${AUTH_UPSTREAM:-keycloak:8080}"
      STATUS_DOMAIN: "${STATUS_DOMAIN:-status.localhost}"
      STATUS_UPSTREAM: "${STATUS_UPSTREAM:-status:3000}"
      API_DOMAIN: "${API_DOMAIN:-api.localhost}"
      API_UPSTREAM: "${API_UPSTREAM:-api:8000}"
      API_RATE_LIMIT: "${API_RATE_LIMIT:-20r/s}"
      API_RATE_BURST: "${API_RATE_BURST:-40}"
      GATEWAY_TLS_REDIRECT: "${GATEWAY_TLS_REDIRECT:-0}"
    ports:
    - "${GATEWAY_HTTP_PORT:-80}:80"
    security_opt:
    - no-new-privileges:true
    networks:
      system:
        aliases:
        - "${APP_DOMAIN:-app.localhost}"
        - "${AUTH_DOMAIN:-auth.localhost}"
        - "${STATUS_DOMAIN:-status.localhost}"
        - "${API_DOMAIN:-api.localhost}"
