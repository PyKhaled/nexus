services:
  status:
    image: ghcr.io/rajnandan1/kener:v4.1.2
    restart: unless-stopped
    depends_on:
      status-redis:
        condition: service_healthy
    environment:
      KENER_SECRET_KEY: ${KENER_SECRET_KEY:-change-me-kener-development-secret-at-least-32-chars}
      ORIGIN: http://${STATUS_DOMAIN:-status.localhost}
      REDIS_URL: redis://status-redis:6379
      DATABASE_URL: sqlite://./database/kener.sqlite.db
    volumes:
      - status-data:/app/database
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/healthcheck').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - system

  status-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - status-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - system

volumes:
  status-data:
  status-redis-data:
