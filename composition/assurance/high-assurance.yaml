apiVersion: nexus.io/assurance/v1alpha1
kind: AssuranceProfile
id: high-assurance
privateRegistry: required-exclusive
immutableImages: true
runtimeBuilds: forbidden
requireSbom: true
requireProvenance: true
requireSignature: true
requireReproducibleBuild: true
denyDevelopmentDefaults: true
networkEgress: deny-by-default
runtimeSecurity:
  noNewPrivileges: true
  privilegedForbidden: true
  privateDependencyPortsForbidden: true
  hostPreflightRequired: true
  externalAuditRequired: true
