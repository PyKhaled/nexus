# Optional Compose overlay for images supporting *_FILE. Not a production stack.
# make up COMPOSE_SECRETS=compose.secrets.yml
services:
  website:
    environment:
      WORDPRESS_DB_PASSWORD: !reset null
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_password
  website-db:
    environment:
      MYSQL_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD: !reset null
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/mysql_root_password)\" mysqladmin ping -h localhost -uroot || exit 1"]
secrets:
  mysql_password:
    file: ${MYSQL_PASSWORD_FILE:?Set MYSQL_PASSWORD_FILE to an absolute host path}
  mysql_root_password:
    file: ${MYSQL_ROOT_PASSWORD_FILE:?Set MYSQL_ROOT_PASSWORD_FILE to an absolute host path}
