server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }

    location / {
        return 404;
    }
}
