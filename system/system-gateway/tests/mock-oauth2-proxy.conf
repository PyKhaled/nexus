server {
    listen 80 default_server;
    server_name _;

    location = /oauth2/auth {
        add_header X-Auth-Request-User "placeholder-user" always;
        add_header X-Auth-Request-Email "placeholder@example.test" always;
        add_header X-Auth-Request-Groups "developers" always;

        if ($http_x_test_auth = "allow") {
            return 202;
        }

        return 401;
    }

    location /oauth2/ {
        default_type text/plain;
        return 200 "placeholder oauth2 endpoint\n";
    }
}
