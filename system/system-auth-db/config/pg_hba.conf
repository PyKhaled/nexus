# PostgreSQL Client Authentication Configuration for keycloak-db.
#
# Mounted read-only into the container and loaded explicitly via:
#   postgres -c hba_file=/etc/postgresql/pg_hba.conf
#
# The service is not published to the host and only reachable from the
# internal "system" docker network, but this file is defense-in-depth:
# every entry requires a password (scram-sha-256), nothing trusts by IP alone.
#
# TYPE   DATABASE   USER   ADDRESS            METHOD
local    all        all                       scram-sha-256
host     all        all    127.0.0.1/32       scram-sha-256
host     all        all    ::1/128            scram-sha-256

# Docker default bridge / compose network ranges
host     all        all    172.16.0.0/12      scram-sha-256
host     all        all    10.0.0.0/8         scram-sha-256
host     all        all    192.168.0.0/16     scram-sha-256

# Everything else is rejected by omission (no catch-all "all/all" line).
