# PostgreSQL 16 production configuration for the keycloak-db service.
#
# Mounted read-only into the container and loaded explicitly via:
#   postgres -c config_file=/etc/postgresql/postgresql.conf
#
# Sizing below assumes a small single-node deployment (~1 vCPU / 1-2GB RAM
# reserved for this container). If you change the container's memory limit,
# rescale shared_buffers / effective_cache_size / work_mem accordingly
# (shared_buffers ~= 25% of RAM, effective_cache_size ~= 50-75% of RAM).

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
huge_pages = try

# ---------------------------------------------------------------------------
# WAL / durability
# ---------------------------------------------------------------------------
wal_level = replica
max_wal_senders = 5
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
fsync = on
synchronous_commit = on
full_page_writes = on

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---------------------------------------------------------------------------
# Autovacuum
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ---------------------------------------------------------------------------
# Logging
# Containerized: log to stderr so `docker logs` / the compose logging driver
# captures everything. Do not enable logging_collector (would write files
# into the PGDATA volume instead).
# ---------------------------------------------------------------------------
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 250ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ---------------------------------------------------------------------------
# Locale / misc
# ---------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# ---------------------------------------------------------------------------
# Statement behavior
# Kept generous so Keycloak migrations aren't killed; tighten per-role
# with ALTER ROLE ... SET statement_timeout if a specific workload needs it.
# ---------------------------------------------------------------------------
statement_timeout = 60s
idle_in_transaction_session_timeout = 10min
