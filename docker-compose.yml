name: beacon

services:
  
  overseer:
    build: /Users/ahmedkhaled/Sites/Overseer
    ports:
      - "8080:8080"
    networks:
      - system
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  loadbalancer:
    build: ./system-loadbalancer
    container_name: loadbalancer
    env_file:
      - ./system-loadbalancer/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./system-loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./system-loadbalancer/conf.d:/etc/nginx/conf.d:ro
      - ./system-loadbalancer/ssl:/etc/nginx/ssl:ro
      - ./system-loadbalancer/logs:/var/log/nginx
    networks:
      - system

  # Authentication service
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    env_file:
    - ./system-auth-db/.env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    volumes:
    - ./system-auth-db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-authentik} -d ${PG_DB:-authentik} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - system

  auth-server:
    image: authentik/server:2026.5.3
    command: server
    container_name: auth-server
    depends_on:
      auth-db:
        condition: service_healthy
    env_file:
    - ./system-auth/.env
    shm_size: 512mb
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./system-auth/data:/data
      - ./system-auth/certs:/etc/ssl/certs
      - ./system-auth/custom-templates:/templates
    networks:
      - system
    ports:
      - 9000:9000
      - 9443:9443

  auth-worker:
    image: authentik/server:2026.5.3
    command: worker
    container_name: auth-worker
    depends_on:
      auth-db:
        condition: service_healthy
    env_file:
    - ./system-auth/.env
    shm_size: 512mb
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./system-auth/data:/data
    - ./system-auth/certs:/certs
    - ./system-auth/custom-templates:/templates
    networks:
      - system

  # Website Service
  website-db:
    image: mysql:8.0
    container_name: website-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?root password required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?wordpress password required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - website-db-data:/var/lib/mysql
    networks:
      - system

  website:
    image: wordpress:latest
    container_name: website
    depends_on:
      website-db:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=website-db:3306
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE:-wordpress}
      - WORDPRESS_DB_USER=${MYSQL_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - system


networks:
  system:
    driver: internal
