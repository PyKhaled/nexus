name: nexus-development

services:
  gateway:
    build:
      context: ./system/system-gateway
    image: nexus/system-gateway:local
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_UPSTREAM: ${APP_UPSTREAM:-website:80}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.localhost}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-keycloak:8080}
      STATUS_DOMAIN: ${STATUS_DOMAIN:-status.localhost}
      STATUS_UPSTREAM: ${STATUS_UPSTREAM:-status:3000}
      OVERSEER_DOMAIN: ${OVERSEER_DOMAIN:-overseer.localhost}
      OVERSEER_UPSTREAM: ${OVERSEER_UPSTREAM:-overseer:8765}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20r/s}
      API_RATE_BURST: ${API_RATE_BURST:-40}
      GATEWAY_TLS_REDIRECT: ${GATEWAY_TLS_REDIRECT:-0}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      system:
        aliases:
          - ${APP_DOMAIN:-localhost}
          - ${AUTH_DOMAIN:-auth.localhost}
          - ${STATUS_DOMAIN:-status.localhost}
          - ${OVERSEER_DOMAIN:-overseer.localhost}
          - ${API_DOMAIN:-api.localhost}

  keycloak:
    build:
      context: ./system/system-auth
      dockerfile: dockerfile
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    env_file:
      - ./system/system-auth/.env.example
      - path: ./system/system-auth/.env
        required: false
    volumes:
      - ./system/system-auth/realm-config:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - system

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./system/system-auth-db/.env.example
      - path: ./system/system-auth-db/.env
        required: false
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    shm_size: 256mb
    volumes:
      - ./system/system-auth-db/data:/var/lib/postgresql/data
      - ./system/system-auth-db/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./system/system-auth-db/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - system

  website:
    image: wordpress:7.0-apache
    restart: unless-stopped
    depends_on:
      website-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: website-db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-wordpress-password}
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - system

  website-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-wordpress-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-wordpress-password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - website-db-data:/var/lib/mysql
    networks:
      - system

  status:
    image: ghcr.io/rajnandan1/kener:v4.1.2
    restart: unless-stopped
    depends_on:
      status-redis:
        condition: service_healthy
    environment:
      KENER_SECRET_KEY: ${KENER_SECRET_KEY:-change-me-kener-development-secret-at-least-32-chars}
      ORIGIN: http://${STATUS_DOMAIN:-status.localhost}
      REDIS_URL: redis://status-redis:6379
      DATABASE_URL: sqlite://./database/kener.sqlite.db
    volumes:
      - status-data:/app/database
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/healthcheck').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - system

  status-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - status-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - system

  overseer:
    image: ghcr.io/pykhaled/overseer:3.0
    restart: unless-stopped
    environment:
      OVERSEER_COMPOSE_PROJECT: ${OVERSEER_COMPOSE_PROJECT:-nexus-development}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - system

networks:
  system:
    name: nexus-system
    driver: bridge

volumes:
  status-data:
  status-redis-data:
  website-db-data:
  wordpress-data:
