name: beacon

# include:
#   - system-auth/system-auth.compose.yml
#   - system-website/system-website.compose.yml

services:

  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    ports:
      - '3552:3552'
    env_file:
      - ./secrets.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  overseer:
    build: /Users/ahmedkhaled/Sites/Overseer
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  loadbalancer:
    build: ./system-loadbalancer
    env_file:
      - ./system-loadbalancer/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./system-loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./system-loadbalancer/conf.d:/etc/nginx/conf.d:ro
      - ./system-loadbalancer/ssl:/etc/nginx/ssl:ro
      - ./system-loadbalancer/logs:/var/log/nginx

networks:
  system:
    driver: bridge
    internal: true
