# Documentation example: optional TLS overlay for local development.
services:
  gateway:
    environment:
      GATEWAY_TLS_REDIRECT: "1"
      TLS_CERTIFICATE: ${TLS_CERTIFICATE:-/etc/nginx/ssl/fullchain.pem}
      TLS_CERTIFICATE_KEY: ${TLS_CERTIFICATE_KEY:-/etc/nginx/ssl/privkey.pem}
    ports:
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ${GATEWAY_TLS_DIR:-./system/system-gateway/ssl}:/etc/nginx/ssl:ro
      - ./system/system-gateway/templates-tls/01-default-tls.conf.template:/etc/nginx/templates/01-default-tls.conf.template:ro
      - ./system/system-gateway/templates-tls/11-app-tls.conf.template:/etc/nginx/templates/11-app-tls.conf.template:ro
      - ./system/system-gateway/templates-tls/21-auth-tls.conf.template:/etc/nginx/templates/21-auth-tls.conf.template:ro
      - ./system/system-gateway/templates-tls/31-api-tls.conf.template:/etc/nginx/templates/31-api-tls.conf.template:ro
