# Documentation example: optional unprotected API route for local development.
# Apply only when the composition also declares a reachable `api` service.
services:
  gateway:
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20r/s}
      API_RATE_BURST: ${API_RATE_BURST:-40}
    volumes:
      - ./system/system-gateway/templates-api/30-api.conf.template:/etc/nginx/templates/30-api.conf.template:ro
