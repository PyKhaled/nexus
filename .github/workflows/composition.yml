name: Composition

on:
  pull_request:
    paths:
      - composition/**
      - tools/nexus_compose/**
      - bin/nexus-compose
      - compose.yml
      - makefile
      - .github/workflows/composition.yml
  push:
    branches:
      - main
    paths:
      - composition/**
      - tools/nexus_compose/**
      - bin/nexus-compose
      - compose.yml
      - makefile
      - .github/workflows/composition.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate JSON Schemas
        run: ruby -rjson -e 'Dir["composition/schemas/*.json"].sort.each { |path| JSON.parse(File.read(path)) }'

      - name: Run compiler tests
        run: make composition-test

      - name: Generate and validate development
        run: |
          bin/nexus-compose generate \
            --selection composition/examples/nexus-development.yaml \
            --output generated/nexus-development
          bin/nexus-compose validate generated/nexus-development

      - name: Generate and validate hardened production
        run: |
          bin/nexus-compose generate \
            --selection composition/examples/nexus-self-hosted-production.yaml \
            --output generated/nexus-production
          bin/nexus-compose validate generated/nexus-production

      - name: Generate and validate high assurance
        run: |
          bin/nexus-compose generate \
            --selection composition/examples/nexus-high-assurance.yaml \
            --output generated/nexus-high-assurance
          bin/nexus-compose validate generated/nexus-high-assurance
